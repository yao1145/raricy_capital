# raricy_capital —— capital1 / capital2 双基金独立服务
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raricy-capital"
version = "0.3.0"
description = "capital1 / capital2 双基金独立服务（raricy_capital）"
requires-python = ">=3.12"
# 运行期最小依赖：站点 HTTP、配置 YAML、控制台、凭据保险箱与本地二维码渲染。
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "cryptography>=43",
    "qrcode[pil]>=8",
]

[project.optional-dependencies]
research = ["numpy>=2", "numba>=0.61", "pandas>=2", "matplotlib>=3.9"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
raricy-capital = "raricy_capital.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["raricy_capital*"]

[tool.setuptools.package-data]
raricy_capital = ["static/*"]

[tool.pytest.ini_options]
# pythonpath 让测试无需先安装包即可导入 raricy_capital
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
